<!DOCTYPE html>
<html>
    <head>
        <title>Tapsirmalar</title>
        <style>
            .header{
                height: 60px;
                display: flex;
                flex-direction: row;
                align-items: center;
                background-color: green;
            }
            .home{
                margin-left: 10px;
                color: white;
            }
            .input-box{
                flex: 1;
                margin-left: 40px;
                margin-right: 40px;
            }
            .btn-box{
                margin-right: 10px;
            }
            p{
                margin-top: 0;
                margin-bottom: 0;
            }
            input{
                width: 100%;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="home">
                <p>Home</p>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Search">
            </div>
            <div class="btn-box">
                <button style="color: white; background-color: green; border: 1px solid white;">Download</button>
            </div>
        </div>
    </body>
</html>
