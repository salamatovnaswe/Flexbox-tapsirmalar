<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <!--1 tapsirma-->
        <h2 style="text-align: center;">Grid</h2>

        <div style="display: grid; grid-template-columns: 100px 1fr;">
            <div style="background-color: lightblue;">Box-1</div>
            <div style="background-color: lightcoral;">Box-2</div>
        </div>

        <hr>
        <!--2 tapsirma-->

        <h2 style="text-align: center;">Flexbox</h2>

        <div style="display: flex; flex-direction: row;">
            <div style="background-color: lightgreen; flex: 1;">flex-1</div>
            <div style="background-color: lightsalmon; flex: 1;">flex-2</div>
        </div>

        <hr>
        <!--3 tapsirma-->

        <h2 style="text-align: center;">Tapsirma</h2>

        <div style="display: flex; flex-direction: row;">
            <div style="background-color: lightseagreen; flex: 1;">Box-1</div>
            <div style="background-color: lightblue; flex: 1;">Box-2</div>
        </div>

        <hr>
        <!--4 tapsirma-->

        <h2 style="text-align: center;">Flex Tapsirma</h2>

        <div style="display: flex; flex-direction: row;">
            <div style="background-color: lightskyblue; width: 200px;">200px</div>
            <div style="background-color: lightsalmon;" width: 75px;>75px</div>
        </div>

        <hr>
        <!--5 tapsirma-->
        <h2 style="text-align: center;">Flexbox</h2>

        <div style="display: flex; flex-direction: row;">
            <div style="background-color: lightblue; width: 50px;">Box-1</div>
            <div style="background-color: lightcoral; flex: 1;">Box-2</div>
            <div style="background-color: lightgreen; width: 75px;">Box-3</div>
        </div>

        <hr>
        <!--6 tapsirma-->

        <div style="display: flex; flex-direction: row;">
            <div style="background-color: green; flex: 1;">flex 1</div>
            <div style="background-color: pink; flex: 3;">flex 3</div>
            <div style="background-color: blue; flex: 1;">flex 1</div>
         </div>
         <div style="
                height: 150px;
                border: 3px solid black;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                ">
            <div style="background-color: lightblue;">Ajayip!</div>
         </div>
    </body>
</html>
