<!DOCTYPE html>
<html>
    <head>
        <title>Flex</title>
        <style>
            .box{
                border: 2px solid black;
                height: 50px;
                display: flex;
                flex-direction: row;
                justify-content: start;
            }
            .hi{
                border: 2px solid black;
                height: 50px;
                display: flex;
                flex-direction: row;
                justify-content: end;
            }
            .bye{
                border: 2px solid black;
                height: 50px;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div style="background-color: lightblue;">Box 1</div>
            <div style="background-color: lightcoral;">Box 2</div>
            <div style="background-color: lightblue;">Box 3</div>
            <div style="background-color: lightcoral;">Box 4</div>
        </div>

        <hr>

        <div class="hi">
            <div style="background-color: lightblue;">Box 1</div>
            <div style="background-color: lightcoral;">Box 2</div>
            <div style="background-color: lightblue;">Box 3</div>
            <div style="background-color: lightcoral;">Box 4</div>
        </div>

        <hr>

        <div class="bye">
            <div style="background-color: lightblue;">Box 1</div>
            <div style="background-color: lightcoral;">Box 2</div>
            <div style="background-color: lightblue;">Box 3</div>
            <div style="background-color: lightcoral;">Box 4</div>
        </div>

        <hr>

        <div style="
            border: 2px solid black;
            flex-direction: row;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            ">
            <div style="background-color: lightblue;">Box</div>
            <div style="background-color: lightsalmon;">Box</div>
        </div>
        
    </body>
</html>
